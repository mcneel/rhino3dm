# Builds the Rhino3dm .NET API reference with owl (McNeel.Owl) and publishes it to Heroku, which
# CloudFront serves at https://developer.rhino3d.com/api/rhino3dm/. Mirrors doc-gen.yml in mcneel/rhino.

name: workflow doc-gen

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Push the built site to Heroku
        type: boolean
        default: true

env:
  # The slug names the heroku app (mcneel-apidocs-<slug>), the path CloudFront forwards under, and
  # the artifact, because all three follow from it.
  SLUG: rhino3dm
  TITLE: Rhino3dm API
  HEROKU_APP: mcneel-apidocs-rhino3dm

jobs:
  build_docs:
    name: rhino3dm dotnet docs
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4.1.1

      # methodgen parses librhino3dm_native against the opennurbs headers; nothing else is needed
      - name: update submodules
        run: git submodule update --init src/lib/opennurbs

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # writes src/dotnet/AutoNativeMethods.cs and AutoNativeEnums.cs (gitignored), which
      # Rhino3dm.csproj compiles against. The native library itself is not needed for docs.
      - name: methodgen
        run: python3 build.py methodgen

      - name: install owl
        run: dotnet tool install McNeel.Owl --tool-path owl-bin

      - name: build documentation site
        # --tfm: Rhino3dm multi-targets; net10.0 is the newest surface
        # --base is the path CloudFront forwards under
        # --server adds the node app Heroku runs
        run: |
          ./owl-bin/owl build src/dotnet/Rhino3dm.csproj \
            --tfm net10.0 \
            --name "$TITLE" \
            --logo .github/workflows/doc-gen/docs-icon-dark.svg \
            --logo-dark .github/workflows/doc-gen/docs-icon-dark.svg \
            --favicon .github/workflows/doc-gen/docs-favicon.ico \
            --api-versions 9,8 \
            --out deploy \
            --base /api/$SLUG \
            --site-url https://developer.rhino3d.com \
            --server \
            --quiet

      - name: upload model
        uses: actions/upload-artifact@v4.3.1
        with:
          name: ${{ env.SLUG }}-model
          path: ${{ github.workspace }}/.owl/json
          include-hidden-files: true
          if-no-files-found: error

      - name: deploy to heroku
        if: inputs.deploy
        run: |
          cd deploy
          git init -q
          git config user.email "bozo@mcneel.com"
          git config user.name "Bozo"
          git remote add heroku https://heroku:${{ secrets.HEROKU_API_KEY_EHSAN }}@git.heroku.com/$HEROKU_APP.git
          git add .
          git commit -q -m "publish $TITLE from github.com/mcneel/rhino3dm: ${{ github.ref_name }}"
          git push heroku HEAD:master --force

      - name: invalidate cloudfront cache
        if: inputs.deploy
        run: |
          curl --fail-with-body --location 'https://api.mcneel.com/cloudfront/invalidate' \
            --header 'Authorization: Basic ${{ secrets.MCNEEL_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data "{\"url\":\"https://developer.rhino3d.com/api/$SLUG/*\"}"
