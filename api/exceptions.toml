reason = "three.js interop; merges meshes before export"

[[js_extra]]
type = "Rhino.Geometry.Mesh"
js = "createFromThreejsJSON"
kind = "static"
reason = "three.js interop; inverse of toThreejsJSON"

[[js_extra]]
type = "Rhino.Geometry.PointCloud"
js = "toThreejsJSON"
reason = "three.js interop; no RhinoCommon counterpart"

[[js_extra]]
type = "Rhino.Geometry.PointCloud"
js = "toThreejsBuffers"
reason = "three.js interop; zero-copy typed-array buffers"

[[js_extra]]
