# Old (hand-bound) rhino3dm members retired in favour of generated members.
#
# Read by tools/generate/old_coverage.py, which tags the rows of
# docs/vnext/rhino3dm-only-members.md and checks every `by` member exists in
# the built generated module (a missing one is reported, never tagged as
# replaced). Human-readable rationale: docs/vnext/retired-members.md.
#
#   status = "replaced"       an equivalent is generated (`by`) and tested (`test`)
#   status = "proposed-drop"  no RhinoCommon equivalent; retired only if Luis accepts
#
# `by` names generated classes as registered (X suffix while both surfaces coexist).

