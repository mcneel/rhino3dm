# Old (hand-bound) rhino3dm members retired in favour of generated members.
#
# Read by tools/generate/old_coverage.py, which tags the rows of
# docs/vnext/rhino3dm-only-members.md and checks every `by` member exists in
# the built generated module (a missing one is reported, never tagged as
# replaced). Human-readable rationale: docs/vnext/retired-members.md.
#
#   status = "replaced"       an equivalent is generated (`by`) and tested (`test`)
#   status = "proposed-drop"  no RhinoCommon equivalent; retired only if Luis accepts
#
# `by` names generated classes as registered (X suffix while both surfaces coexist).

# ---- SubD component iterators: rooted at the SubD (subd.Faces / Edges / Vertices)

[[retired]]
class = "BND_SubDFaceIteratorFromSubD"
member = "Count"
status = "replaced"
by = ["SubDFaceListX.Count"]
test = "test_subd_lists_iterate_like_foreach"

[[retired]]
class = "BND_SubDEdgeIteratorFromSubD"
member = "Count"
status = "replaced"
by = ["SubDEdgeListX.Count"]
test = "test_subd_lists_iterate_like_foreach"

[[retired]]
class = "BND_SubDVertexIteratorFromSubD"
member = "Count"
status = "replaced"
by = ["SubDVertexListX.Count"]
test = "test_subd_lists_iterate_like_foreach"

[[retired]]
class = "BND_SubDVertexIteratorFromSubD"
member = "First"
status = "replaced"
by = ["SubDVertexListX.First"]
test = "test_subd_lists_iterate_like_foreach"

[[retired]]
class = "BND_SubDFaceIteratorFromSubD"
members = ["First", "Next", "Last", "Current", "CurrentIndex"]
status = "proposed-drop"
note = "no RhinoCommon cursor; iterate subd.Faces"

[[retired]]
class = "BND_SubDEdgeIteratorFromSubD"
members = ["First", "Next", "Last", "Current", "CurrentIndex"]
status = "proposed-drop"
note = "no RhinoCommon cursor; iterate subd.Edges"

[[retired]]
class = "BND_SubDVertexIteratorFromSubD"
members = ["Next", "Last", "Current", "CurrentIndex"]
status = "proposed-drop"
note = "no RhinoCommon cursor; iterate subd.Vertices"

